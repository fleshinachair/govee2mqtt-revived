name: "Govee to MQTT (Revived)"
image: ghcr.io/fleshinachair/govee2mqtt-revived
version: "2026.11.28.0642"
slug: govee2mqtt_revived
description: Control Govee Devices
url: https://github.com/fleshinachair/govee2mqtt-revived
# Lights send colour temperature in Kelvin
homeassistant: "2025.2.0"
arch:
  - amd64
  - aarch64
init: false
startup: services
services:
  - mqtt:need

apparmor: true

# The web page opens inside Home Assistant. Port 0 has it pick a free port,
# which suits host networking.
ingress: true
ingress_port: 0
panel_icon: mdi:led-strip-variant
panel_title: Govee

# Host network access is required for LAN discovery
host_network: true

map:
  - type: addon_config
    read_only: false
    path: /app/config

options:
  temperature_scale: "C"

schema:
  temperature_scale: "str?"
  http_addr: "str?"
  http_port: "port?"
  govee_email: "str?"
  govee_password: "password?"
  govee_2fa_code: "password?"
  govee_api_key: "password?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  mqtt_tls: "bool?"
  mqtt_ca: "str?"
  hass_discovery_prefix: "str?"
  debug_level: "str?"
  no_multicast: "bool?"
  broadcast_all: "bool?"
  global_broadcast: "bool?"
  scan: "str?"
  lan_query_attempts: "int(1,100)?"
  lan_query_backoff_ms: "int(1,3000)?"
  lan_breaker_threshold: "int(0,)?"
  lan_breaker_cooldown: "int(30,900)?"
  disable_effects: "bool?"
  allowed_effects: "str?"
  music_palette: "bool?"
  offline_unavailable: "bool?"
  disable_platform_mqtt: "bool?"
  ignore_devices: "str?"
  no_iot_control: "str?"
  sensor_poll_interval: "int(60,900)?"
